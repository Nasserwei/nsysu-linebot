services:
  - type: web
    name: nsysu-mis-linebot
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./data/nsysu_bot.db
      - key: CRAWLER_INTERVAL_MINUTES
        value: "30"
      - key: ENABLE_BROADCAST
        value: "true"
      - key: NLP_SIMILARITY_THRESHOLD
        value: "0.15"
